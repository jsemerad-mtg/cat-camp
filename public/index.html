<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cat Camp</title>
<style>
  :root {
    --cream: #FFF8ED;
    --card-cream: #FFEFDD;
    --ink: #3B2E2A;
    --ink-soft: #6B5B52;
    --orange: #E8863C;
    --orange-dark: #C4632B;
    --orange-deep: #9A4E20;
    --teal: #4FA895;
    --teal-dark: #35786F;
    --peach: #FFD9C2;
    --sad-blue: #DCEAF5;
    --sad-blue-dark: #3E6E90;
    --mad-red: #F6D6D2;
    --mad-red-dark: #B5432E;
    --shy-purple: #EAE0F2;
    --shy-purple-dark: #6E5590;
    --amber: #FFE3C2;
    --wrong: #E2725B;
    --entry-blue: #2E90FA;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--cream);
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: center;
    padding-block: 16px;
    box-sizing: border-box;
  }
  h1, h2, .fredoka { font-family: 'Fredoka', sans-serif; }
  button { font-family: inherit; border: none; cursor: pointer; background: none; padding: 0; color: inherit; }
  a { text-decoration: none; color: inherit; }
  #phone {
    width: 100%;
    max-width: 600px;
    min-height: min(calc(100dvh - 32px), 880px);
    max-height: min(calc(100dvh - 32px), 880px);
    background: var(--cream);
    border-radius: 28px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 4px 24px rgba(59,46,42,0.12), 0 0 0 1px rgba(59,46,42,0.06);
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .screen { display: flex; flex-direction: column; gap: 16px; flex: 1; }
  .row { display: flex; align-items: center; }
  .between { justify-content: space-between; }
  .center { justify-content: center; align-items: center; text-align: center; }
  .col { display: flex; flex-direction: column; }
  .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap14 { gap: 14px; } .gap16 { gap: 16px; }
  .grow { flex-grow: 1; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 999px; background: var(--card-cream);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; background: var(--amber);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--orange-dark);
  }
  .avatar { border-radius: 50%; object-fit: cover; display: block; }
  .card-btn {
    display: flex; align-items: center; gap: 14px; border-radius: 20px; padding: 18px;
    color: #fff; text-align: left; width: 100%;
  }
  .card-icon {
    width: 48px; height: 48px; border-radius: 14px; background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .primary-btn {
    display: flex; align-items: center; justify-content: center; background: var(--orange);
    border-radius: 999px; padding: 14px; box-shadow: 0 5px 0 var(--orange-dark); width: 100%;
    font-weight: 600; font-size: 16px; color: #fff;
  }
  .primary-btn.disabled { background: #F1E7DA; box-shadow: 0 5px 0 #E4D8C8; color: #A08A80; }
  .text-input {
    width: 100%; border-radius: 14px; border: 2px solid var(--card-cream); background: #fff;
    padding: 14px 16px; font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600;
    color: var(--ink); text-align: center;
  }
  .text-input:focus { outline: none; border-color: var(--orange); }
  .speech-bubble {
    position: relative; background: var(--card-cream); border-radius: 18px; padding: 14px 18px;
    font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 600; color: var(--ink); text-align: center;
  }
  .speech-bubble:after {
    content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    border: 9px solid transparent; border-top-color: var(--card-cream);
  }
  .speech-bubble.tail-left { text-align: left; }
  .speech-bubble.tail-left:after {
    left: -8px; top: 22px; transform: none;
    border: 8px solid transparent; border-top-color: transparent; border-right-color: var(--card-cream);
  }
  .choice-btn {
    flex: 1; border-radius: 999px; padding: 12px; text-align: center; background: var(--card-cream);
    font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; color: var(--ink);
  }
  .choice-btn.primary { background: var(--orange); color: #fff; }
  .choice-btn.wrong { background: var(--wrong); color: #fff; }
  .tip-bubble {
    display: flex; align-items: center; gap: 8px; background: #DFF3EF; border-radius: 12px; padding: 10px 12px;
  }
  .tip-bubble span.txt { font-size: 12px; color: var(--teal-dark); flex-grow: 1; }
  .tip-bubble.big { padding: 14px 16px; border-radius: 14px; }
  .tip-bubble.big span.txt { font-size: 16px; font-weight: 600; }
  .numpad { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
  .numkey {
    height: 52px; border-radius: 14px; background: var(--card-cream); color: var(--ink);
    font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .numkey.active { background: var(--orange); color: #fff; }
  .numkey.correct { background: var(--teal); color: #fff; }
  .numkey.wrong { background: var(--wrong); color: #fff; }
  .numkey.clear { grid-column: 1 / -1; background: transparent; color: var(--ink-soft); font-size: 14px; font-weight: 700; height: 34px; }
  .box {
    min-width: 54px; height: 54px; border-radius: 12px; border: 3px solid var(--orange);
    background: #fff; display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; padding: 0 8px;
  }
  .box.correct { background: #DFF3EF; }
  .box.wrong { background: var(--mad-red); }
  .box.entering { color: var(--entry-blue); border-color: var(--entry-blue); }
  .kbd { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; }
  .letterkey {
    height: 40px; border-radius: 10px; background: var(--card-cream); color: var(--ink);
    font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .letterkey.correct { background: #DFF3EF; color: var(--teal-dark); }
  .letterkey.wrong { background: var(--mad-red); color: var(--orange-dark); }
  .wordbox {
    width: 44px; height: 52px; border-radius: 10px; background: var(--card-cream);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700;
  }
  .wordbox.filled { background: #DFF3EF; color: var(--teal-dark); }
  .emotion-tile {
    display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 14px;
    padding: 8px 2px; border: 3px solid transparent;
  }
  .emotion-tile.picked { border-color: var(--ink); }
  .mood-tile {
    display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: 16px;
    padding: 12px 4px; border: 3px solid transparent;
  }
  .mood-tile.picked { border-color: var(--ink); }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .swatch-circle {
    width: 46px; height: 46px; border-radius: 50%; border: 3px solid transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .swatch-circle.ring { border-color: var(--ink); }
  .outfit-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--card-cream);
    border-radius: 14px; padding: 10px 14px; border: 3px solid transparent;
  }
  .outfit-btn.ring { border-color: var(--ink); }
  .stat-card {
    border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; align-items: center;
  }
  .chore-card {
    display: flex; align-items: center; gap: 12px; background: var(--card-cream); border-radius: 16px;
    padding: 12px 14px; width: 100%; text-align: left;
  }
  .chore-icon { font-size: 26px; width: 34px; text-align: center; flex-shrink: 0; }
  .chore-name { font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 600; }
  .chore-meta { font-size: 11.5px; color: var(--ink-soft); }
  .chore-state {
    font-size: 10.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; flex-shrink: 0; white-space: nowrap;
  }
  .chore-state.available { background: #DFF3EF; color: var(--teal-dark); }
  .chore-state.progress { background: var(--amber); color: var(--orange-deep); }
  .chore-state.done { background: rgba(59,46,42,0.06); color: var(--ink-soft); }
  .pin-dots { display: flex; gap: 16px; justify-content: center; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--card-cream); border: 2px solid var(--orange); }
  .pin-dot.filled { background: var(--orange); }
  .bar-track { flex-grow: 1; height: 12px; border-radius: 6px; background: var(--card-cream); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; }
  @keyframes knead { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes confetti-fall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(140px) rotate(220deg); opacity: 0; }
  }
  .paw-left { animation: knead 0.9s ease-in-out infinite; }
  .paw-right { animation: knead 0.9s ease-in-out infinite 0.45s; }
  .confetti { position: absolute; animation: confetti-fall 2.6s ease-in infinite; }
  [hidden] { display: none !important; }
  .mascot-wrap svg { width: 100%; height: 100%; }
  /* Applied unconditionally (not gated behind a viewport-width media query,
     since preview panes/emulators can report a "desktop" width even when
     the person considers it their mobile view) so content always uses more
     of the card's height instead of leaving one big empty gap. */
  .screen { gap: 24px; }
  .hero-avatar { width: 168px !important; height: 168px !important; }
  .mascot-wrap { width: 112px !important; height: 112px !important; }
  .card-btn { padding: 22px; gap: 16px; }
  .card-icon { width: 56px; height: 56px; }
  .primary-btn { padding: 18px; font-size: 17px; }
  .choice-btn { padding: 16px; font-size: 17px; }
  .numkey { height: 60px; font-size: 22px; }
  .letterkey { height: 48px; font-size: 18px; }
  .box { min-width: 62px; height: 62px; font-size: 28px; }
  .text-input { padding: 16px 18px; font-size: 19px; }
  .stat-card { padding: 20px; }
  .swatch-circle { width: 52px; height: 52px; }
  .outfit-btn { padding: 12px 16px; }
  .emotion-tile, .mood-tile { padding: 12px 4px; }
  .wordbox { width: 48px; height: 58px; }
</style>

    if (!account) return;

  }

  function doSync() {
    if (!account) return;
    syncStatus = "syncing";
    fetch("/api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: account.name, pin: account.pin, state: state })
    }).then(function (r) { return r.json(); }).then(function (res) {
      syncStatus = res && res.ok ? "synced" : "error";
      if (session.view === "account") render();
    }).catch(function () {
      syncStatus = "error";
      if (session.view === "account") render();
    });
  }

  function pullAccountState(cb) {
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: account.name, pin: account.pin })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res && res.ok) {
        state = Object.assign({}, state, res.state);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        syncStatus = "synced";
      } else {
        syncStatus = "error";
      }
      cb && cb(res);

      cb && cb({ ok: false, error: "Network error." });

  }

  // Re-renders once a second while a chore timer is on screen, so the countdown moves
  // and the screen flips to "ask a grown-up" the moment it hits zero. Self-stops once
  // the timer view is left, and is safe to call repeatedly (only one interval runs).
  var choreTickHandle = null;
  function startChoreTicker() {
    if (choreTickHandle) return;
    choreTickHandle = setInterval(function () {
      if (session.view !== "chores" || session.choresStep !== "timer") {
        clearInterval(choreTickHandle);
        choreTickHandle = null;
        return;
      }
      render();
    }, 1000);
  }

    var back = session.checkin ? session.checkin.returnTo : "home";

    else if (back === "copycat") { go("copycat"); }
    else { go("home"); }

  function render() {
    var el = document.getElementById("phone");
    if (!state.onboarded) {
      session.view = "onboarding";
      if (!session.onboard) session.onboard = { step: "askChildName" };
    } else if (!session.view) {
      session.view = needsMoodCheckin() ? "mood" : "home";
    }
    var html = "";
    if (session.view === "onboarding") html = renderOnboarding();
    else if (session.view === "mood") html = renderMood();
    else if (session.view === "home") html = renderHome();
    else if (session.view === "math") html = renderMath();
    else if (session.view === "copycatMenu") html = renderCopyCatMenu();
    else if (session.view === "copycat") html = renderCopyCat();
    else if (session.view === "copycatResult") html = renderCopyCatResult();
    else if (session.view === "checkin") html = renderCheckin();
    else if (session.view === "report") html = renderReport();
    else if (session.view === "customizer") html = renderCustomizer();
    else if (session.view === "chores") html = renderChores();
    else if (session.view === "celebration") html = renderCelebration();
    else if (session.view === "account") html = renderAccount();
    else if (session.view === "mewlingoMenu") html = renderMewLingoMenu();
    else if (session.view === "mewlingo") html = renderMewLingo();
    else if (session.view === "notesMenu") html = renderNotesMenu();
    else if (session.view === "notes") html = renderNotes();
    el.innerHTML = html;
    wireEvents(el);
  }

  function wireEvents(el) {
    var nodes = el.querySelectorAll("[data-action]");
    for (var i = 0; i < nodes.length; i++) {
      (function (node) {
        node.addEventListener("click", function (e) {
          e.preventDefault();
          var action = node.getAttribute("data-action");
          var arg = node.getAttribute("data-arg");
          actions[action](arg);
        });
      })(nodes[i]);
    }
    var inputs = el.querySelectorAll("[data-bind]");
    for (var j = 0; j < inputs.length; j++) {
      (function (node) {
        var bindKey = node.getAttribute("data-bind");
        node.addEventListener("input", function () {
          session[bindKey] = node.value;
        });
        var enterAction = node.getAttribute("data-enter-action");
        if (enterAction) {
          node.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
              e.preventDefault();
              actions[enterAction]();
            }
          });
        }
        if (node.hasAttribute("data-autofocus")) {
          setTimeout(function () { node.focus(); }, 0);
        }
      })(inputs[j]);
    }
  }

        m.wrongAttempts = (m.wrongAttempts || 0) + 1;

          m.checked = true;
          m.showCheckin = true;
        } else {
          m.checked = false;
          m.entered = null;
          m.retryPrompt = true;

  // ================= math logic =================
  function generateMathProblem(allowSubtraction, allowTeens) {
    var useTeen = allowTeens && Math.random() < 0.45;
    var op, a, b, c;
    if (useTeen) {
      // next level: two single-digit addends that cross 10, sums 10-18
      op = "+";
      a = randInt(2, 9);
      var bMin = Math.max(1, 10 - a);
      var bMax = 9;
      b = randInt(bMin, bMax);
      c = a + b;
    } else {
      op = allowSubtraction && Math.random() < 0.4 ? "-" : "+";
      if (op === "+") {
        a = randInt(0, 9);
        b = randInt(0, 9 - a);
        c = a + b;
      } else {
        a = randInt(1, 9);
        b = randInt(0, a);
        c = a - b;
      }
    }
    var slot = randInt(0, 2);
    var left, right, result, correctAnswer, treats = null;
    if (slot === 0) {
      left = a; right = b; result = null; correctAnswer = c;
      if (useTeen) treats = null;
      else if (op === "+") treats = { mode: "combine", filled: a, outline: b, label: "Count all the treats to add them up!" };
      else treats = { mode: "remove", total: a, keep: c, remove: b, label: "Cross out " + b + " and count what's left!" };
    } else if (slot === 1) {
      left = null; right = b; result = c; correctAnswer = a;
      if (!useTeen && op === "+") treats = { mode: "missing", total: c, filled: b, outline: a, label: "Count the empty treats!" };
      else treats = null;
    } else {
      left = a; right = null; result = c; correctAnswer = b;
      if (!useTeen && op === "+") treats = { mode: "missing", total: c, filled: a, outline: b, label: "Count the empty treats!" };
      else treats = null;
    }
    return { left: left, op: op, right: right, result: result, correctAnswer: correctAnswer, treats: treats };
  }

  // ================= copy-cat logic =================
  function startCopyCat(mode, level) {
    var wordObj;
    if (mode === "gauntlet") {
      level = level || GAUNTLET_START;
      var choices = wordsOfLength(level);
      wordObj = choices.length ? pick(choices) : pick(WORD_BANK);
    } else {
      level = null;
      wordObj = pick(WORD_BANK);
    }
    var isShort = wordObj.word.length <= 4;
    var correct = [];
    if (isShort) {
      // short words are hard to guess blind - start with one free letter and the hint always visible
      correct.push(wordObj.word[randInt(0, wordObj.word.length - 1)]);
    }
    session.copycat = {
      mode: mode, level: level, wordObj: wordObj, correct: correct, wrong: [], isShort: isShort,
      hintRevealed: isShort, usedHelp: false, outcome: null, pointsEarned: 0
    };
    go("copycat");
  }

  function awardCopyCatWin() {
    var c = session.copycat;
    c.pointsEarned = COPYCAT_WIN_POINTS;
    state.points += c.pointsEarned;
    saveState();
    setTimeout(function () { finishCopyCatWord(true); }, 500);
  }

  function finishCopyCatWord(won) {
    recordDailyPlay();

    c.outcome = won ? "won" : "lost";
    if (won) {
      session.copycatLossStreak = 0;
      state.levelsCompleted = (state.levelsCompleted || 0) + 1;
      if (c.mode === "gauntlet" && c.level >= GAUNTLET_END) {
        state.points += (COPYCAT_GAUNTLET_BONUS - c.pointsEarned);
        saveState();
        go("celebration", { celebration: { bonus: COPYCAT_GAUNTLET_BONUS, subtitle: "You beat the whole gauntlet - all the way to an " + GAUNTLET_END + "-letter word!" } });
        return;

    } else {
      session.copycatLossStreak = (session.copycatLossStreak || 0) + 1;
      go("copycatResult");
    }

  // ================= mew-lingo logic =================
  function shuffleArr(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function newMewLingoRound(lang) {
    var correctNum = randInt(1, 10);
    var pool = [];
    for (var n = 1; n <= 10; n++) if (n !== correctNum) pool.push(n);
    var distractors = shuffleArr(pool).slice(0, 2);
    var choiceNums = shuffleArr([correctNum].concat(distractors));
    return { current: correctNum, choices: choiceNums, answered: false, chosenNum: null };
  }

  function startMewLingo(lang) {
    session.mewlingo = {
      lang: lang, index: 0, length: MEWLINGO_LENGTH, mistakes: 0,
      round: newMewLingoRound(lang)
    };
    go("mewlingo");
  }

  function mewlingoPick(numStr) {
    var num = parseInt(numStr, 10);
    var g = session.mewlingo;
    if (g.round.answered) return;
    g.round.answered = true;
    g.round.chosenNum = num;
    var correct = num === g.round.current;
    if (correct) {
      state.points += MEWLINGO_POINTS;
      saveState();
    } else {
      g.mistakes++;
    }
    render();
  }

  function mewlingoSpeak() {
    var g = session.mewlingo;
    if (!g || typeof window.speechSynthesis === "undefined") return;
    var entry = NUMBER_WORDS[g.lang][g.round.current - 1];
    var lang = LANGUAGE_DEFS.filter(function (d) { return d.key === g.lang; })[0];
    try {
      var utter = new SpeechSynthesisUtterance(entry.spoken || entry.word);
      utter.lang = lang.speechLang;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    } catch (e) {}
  }

  function mewlingoNext() {
    var g = session.mewlingo;
    g.index++;
    if (g.index >= g.length) {
      recordDailyPlay();
      state.levelsCompleted = (state.levelsCompleted || 0) + 1;
      if (g.mistakes === 0) {
        state.points += MEWLINGO_PERFECT_BONUS;
        saveState();
        go("celebration", { celebration: { bonus: MEWLINGO_PERFECT_BONUS, subtitle: g.length + " for " + g.length + " - you're a Mew-lingo star!" } });
      } else {
        saveState();
        go("home");
      }
      return;
    }
    g.round = newMewLingoRound(g.lang);
    render();
  }

  // ================= note-reading logic =================
  var STAFF_ALL_NOTES = [
    { letter: "E", y: 120 }, { letter: "F", y: 110 }, { letter: "G", y: 100 }, { letter: "A", y: 90 },
    { letter: "B", y: 80 }, { letter: "C", y: 70 }, { letter: "D", y: 60 }, { letter: "E", y: 50 }, { letter: "F", y: 40 }
  ];
  var NOTES_LENGTH = 8;
  var NOTES_POINTS = 1;
  var NOTES_PERFECT_BONUS = 5;

  function notesPoolForLevel(level) {
    if (level === "lines") return STAFF_ALL_NOTES.filter(function (n, i) { return i % 2 === 0; });
    return STAFF_ALL_NOTES;
  }

  function newNotesRound(level) {
    var pool = notesPoolForLevel(level);
    var note = pool[randInt(0, pool.length - 1)];
    var letters = ["A", "B", "C", "D", "E", "F", "G"];
    var others = shuffleArr(letters.filter(function (l) { return l !== note.letter; })).slice(0, 3);
    var choices = shuffleArr([note.letter].concat(others));
    return { note: note, choices: choices, answered: false, chosenLetter: null };
  }

  function startNotes(level) {
    session.notes = { level: level, index: 0, length: NOTES_LENGTH, mistakes: 0, round: newNotesRound(level) };
    go("notes");
  }

  function notesPick(letter) {
    var g = session.notes;
    if (g.round.answered) return;
    g.round.answered = true;
    g.round.chosenLetter = letter;
    if (letter === g.round.note.letter) {
      state.points += NOTES_POINTS;
      saveState();
    } else {
      g.mistakes++;
    }
    render();
  }

  function notesNext() {
    var g = session.notes;
    g.index++;
    if (g.index >= g.length) {
      recordDailyPlay();
      state.levelsCompleted = (state.levelsCompleted || 0) + 1;
      if (g.mistakes === 0) {
        state.points += NOTES_PERFECT_BONUS;
        saveState();
        go("celebration", { celebration: { bonus: NOTES_PERFECT_BONUS, subtitle: g.length + " for " + g.length + " - you can really read music!" } });
      } else {
        saveState();
        go("home");
      }
      return;
    }
    g.round = newNotesRound(g.level);
    render();
  }

        '<div class="fredoka" style="font-size:16px;font-weight:700;text-align:center;">That one was tricky! How did that make you feel?</div>' +
        '<div style="display:grid;grid-template-columns:repeat(5, minmax(0,1fr));gap:6px;">' + tilesHtml + "</div>" +
        innerTip +
        "</div>";
    } else {
      var numpad = "";
      for (var n = 0; n <= 9; n++) {
        var cls = "numkey";
        if (!m.checked && m.lastDigit === n) cls += " active";
        numpad += '<button class="' + cls + '" data-action="mathPick" data-arg="' + n + '">' + n + "</button>";
      }
      if ((!m.checked || m.retryPrompt) && hasEntry) {
        numpad += '<button class="numkey clear" data-action="mathClear">Clear</button>';
      }
      var checkBtn;
      if (m.revealed) {
        checkBtn = '<button class="primary-btn fredoka" data-action="mathNext">' + (m.index + 1 >= m.length ? "Finish" : "Next") + "</button>";
      } else if (!m.checked || m.retryPrompt) {
        checkBtn = '<button class="primary-btn fredoka' + (m.entered === null || m.entered === undefined ? " disabled" : "") + '" data-action="mathCheck">Check</button>';
      } else {
        checkBtn = '<button class="primary-btn fredoka" data-action="mathNext">' + (m.index + 1 >= m.length ? "Finish" : "Next") + "</button>";
      }
      bottomHtml = checkBtn + (m.revealed ? "" : '<div class="numpad">' + numpad + "</div>");
    }

    return '<div class="screen">' +
      '<div class="row gap8"><a href="#" data-action="goHome">' + backIcon() + "</a>" + '<div class="row gap8">' + dots + "</div></div>" +
      mascotRow +
      '<div class="col center gap4">' +
      '<div class="row gap10 center">' +
      '<span class="fredoka" style="font-size:40px;font-weight:700;">' + showLeft + "</span>" +
      '<span class="fredoka" style="font-size:40px;font-weight:700;">' + p.op + "</span>" +
      '<span class="fredoka" style="font-size:40px;font-weight:700;">' + showRight + "</span>" +
      '<span class="fredoka" style="font-size:40px;font-weight:700;">=</span>' +
      '<span class="fredoka" style="font-size:40px;font-weight:700;">' + showResult + "</span>" +
      "</div>" +
      '<div style="font-size:13px;color:var(--ink-soft);">Question ' + (m.index + 1) + " of " + m.length + "</div>" +
      "</div>" +
      treatsHtml + tipHtml +
      '<div class="grow"></div>' + bottomHtml +
      "</div>";
  }
  function boxHtml(cls, val) {
    return '<span class="box ' + cls + '" style="display:inline-flex;vertical-align:middle;">' + val + "</span>";
  }

  // ================= render: copy-cat =================
  function renderCopyCat() {
    var c = session.copycat;
    var livesRemaining = 6 - c.wrong.length;
    var paws = "";
    for (var i = 0; i < 6; i++) paws += pawSvg(i < livesRemaining ? 1 : 0.2);
    var tip = !session.copycatTipDismissed ?
      '<div class="tip-bubble"><span>💡</span><span class="txt">' + pick(WORD_TIPS) + '</span><button data-action="dismissTip" data-arg="copycat">' + closeIcon() + "</button></div>" : "";
    var wlen = c.wordObj.word.length;
    var boxStyle = wlen >= 7 ? ' style="width:32px;height:40px;font-size:16px;"' : (wlen === 6 ? ' style="width:38px;height:46px;font-size:19px;"' : "");
    var boxes = c.wordObj.word.split("").map(function (ch) {
      var shown = c.correct.indexOf(ch) !== -1;
      return '<div class="wordbox' + (shown ? " filled" : "") + '"' + boxStyle + ">" + (shown ? ch : "_") + "</div>";
    }).join("");
    var hint = "";
    if (c.isShort) {
      // short words start with a free letter and the hint always visible
      hint = '<div style="text-align:center;font-size:13px;color:var(--ink-soft);">Hint: ' + c.wordObj.hint + "</div>";
    } else {
      var helpUnlocked = c.wrong.length >= 3 && livesRemaining > 0;
      if (helpUnlocked) {
        var fullyRevealed = c.wordObj.word.split("").every(function (ch) { return c.correct.indexOf(ch) !== -1; });
        var btns = "";
        if (!fullyRevealed) btns += '<button class="pill" data-action="revealLetter">Reveal a letter (-' + REVEAL_LETTER_COST + ")</button>";
        if (!c.hintRevealed) btns += '<button class="pill" data-action="revealHint">Give me a hint (-' + HINT_COST + ")</button>";
        if (btns) hint = '<div class="row center" style="gap:8px;flex-wrap:wrap;">' + btns + "</div>";
        if (c.hintRevealed) hint += '<div style="text-align:center;font-size:13px;color:var(--ink-soft);">Hint: ' + c.wordObj.hint + "</div>";
      }
    }
    var keys = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(function (letter) {
      var cls = "letterkey";
      if (c.correct.indexOf(letter) !== -1) cls += " correct";
      if (c.wrong.indexOf(letter) !== -1) cls += " wrong";
      return '<button class="' + cls + '" data-action="letterPick" data-arg="' + letter + '">' + letter + "</button>";
    }).join("");
    var headerLabel = c.mode === "gauntlet" ? "Gauntlet - " + c.level + " letters" : "Copy-Cat";
    return '<div class="screen">' +
      '<div class="row between"><a href="#" data-action="goHome">' + backIcon() + '</a><div class="fredoka" style="font-size:16px;font-weight:600;">' + headerLabel + '</div><div style="width:20px;"></div></div>' +
      tip +
      '<div class="row center" style="gap:8px;">' + paws + "</div>" +
      '<div class="row center">' + mascotSvg("neutral", 70, state.selectedColor, state.selectedOutfit, state.selectedEyeColor, state.selectedWhisker, state.selectedMarking) + "</div>" +
      '<div class="row center" style="gap:10px;flex-wrap:wrap;">' + boxes + "</div>" +
      hint +
      '<div class="grow"></div>' +
      '<div class="kbd">' + keys + "</div>" +
      "</div>";
  }

  function renderMewLingo() {

      return '<button class="swatch" data-action="pickColor" data-arg="' + c.key + '">' +

      var ring = state.selectedEyeColor === d.key ? " ring" : "";
      var lockIcon = locked ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" fill="#fff"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#fff" stroke-width="2" fill="none"/></svg>' : "";
      return '<button class="swatch" data-action="pickEyeColor" data-arg="' + d.key + '">' +

    var whiskerSwatches = WHISKER_COLOR_DEFS.map(function (d) {

      var ring = state.selectedWhisker === d.key ? " ring" : "";
      var lockIcon = locked ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" fill="#fff"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#fff" stroke-width="2" fill="none"/></svg>' : "";
      return '<button class="swatch" data-action="pickWhisker" data-arg="' + d.key + '">' +
        '<div class="swatch-circle' + ring + '" style="background:' + d.color + ';border:1px solid #e2d8ce;">' + lockIcon + "</div>" +
        '<span style="font-size:9px;color:var(--ink-soft);">' + label + "</span></button>";
    }).join("");
    var markingIcons = { none: "⭕", stripes: "🐯", spots: "🐆", heart: "💗" };
    var markings = MARKING_DEFS.map(function (m) {
      var locked = state.points < m.cost;
      var label = locked ? m.cost + " pts" : (state.selectedMarking === m.key ? "Wearing" : "Unlocked");
      var ring = state.selectedMarking === m.key ? " ring" : "";

  // ================= render: chores (Mega Unlocks) =================
  function renderChores() {
    var step = session.choresStep || (state.parentPin ? "menu" : "setup");

    if (step === "setup") {
      var setupErr = session.choresSetupError ? '<div style="background:var(--mad-red);color:var(--orange-deep);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;">' + escapeHtml(session.choresSetupError) + "</div>" : "";
      return '<div class="screen">' +
        '<a href="#" class="row gap6" data-action="goHome">' + backIcon() + '<span style="font-size:14px;font-weight:700;">Back</span></a>' +
        '<div class="col center gap6"><div class="mascot-wrap" style="width:90px;height:90px;">' + mascotSvg("neutral", 90, state.selectedColor, state.selectedOutfit, state.selectedEyeColor, state.selectedWhisker, state.selectedMarking) + "</div>" +
        '<div class="fredoka" style="font-size:20px;font-weight:700;text-align:center;">Mega Unlocks</div>' +
        '<div class="speech-bubble">A grown-up sets a secret 4-digit code here first - it\'s used to confirm chores and achievements are really done.</div></div>' +
        '<div class="col gap10" style="margin-top:8px;">' +
        setupErr +
        '<input type="password" inputmode="numeric" class="text-input" placeholder="New 4-digit code" maxlength="4" autocomplete="off" data-bind="choresPinSetupA" value="' + escapeHtml(session.choresPinSetupA || "") + '">' +
        '<input type="password" inputmode="numeric" class="text-input" placeholder="Confirm code" maxlength="4" autocomplete="off" data-bind="choresPinSetupB" data-enter-action="choresSetupSubmit" value="' + escapeHtml(session.choresPinSetupB || "") + '">' +
        '<button class="primary-btn fredoka" data-action="choresSetupSubmit">Save grown-up code</button>' +
        "</div>" +
        '<div class="grow"></div>' +
        "</div>";
    }

    if (step === "timer" && state.activeChoreTimer) {
      var timerChore = CHORE_DEFS.filter(function (d) { return d.key === state.activeChoreTimer.key; })[0];
      var remainingMs = state.activeChoreTimer.endsAt - Date.now();
      var remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));
      var mm = Math.floor(remainingSec / 60), ss = remainingSec % 60;
      var timeStr = mm + ":" + (ss < 10 ? "0" : "") + ss;
      var done = remainingSec <= 0;
      return '<div class="screen">' +
        '<a href="#" class="row gap6" data-action="choresBackToMenu">' + backIcon() + '<span style="font-size:14px;font-weight:700;">Chores</span></a>' +
        '<div class="grow"></div>' +
        '<div class="col center gap10">' +
        '<span class="fredoka" style="font-size:44px;">' + (timerChore ? timerChore.icon : "🧹") + "</span>" +
        '<div class="fredoka" style="font-size:19px;font-weight:700;text-align:center;">' + (timerChore ? timerChore.label : "Chore") + "</div>" +
        (done ?
          '<div class="tip-bubble big" style="background:#DFF3EF;"><span class="txt" style="color:var(--teal-dark);">Time\'s up! Great work.</span></div>' :
          '<div class="fredoka" style="font-size:56px;font-weight:700;color:var(--orange-dark);">' + timeStr + "</div>" +
          '<div style="font-size:13px;color:var(--ink-soft);">Keep going until the timer ends!</div>') +
        "</div>" +
        '<div class="grow"></div>' +
        (done ?
          '<button class="primary-btn fredoka" data-action="requestChoreVerify" data-arg="' + state.activeChoreTimer.key + '">All done! Ask a grown-up</button>' :
          '<button class="choice-btn fredoka" style="flex-grow:0;" data-action="cancelChoreTimer">Cancel</button>') +
        "</div>";
    }

    if (step === "verify") {
      var v = session.choresVerify || {};
      var vdef = v.type === "chore" ?
        CHORE_DEFS.filter(function (d) { return d.key === v.key; })[0] :
        ACHIEVEMENT_DEFS.filter(function (d) { return d.key === v.key; })[0];
      var pinLen = (session.choresPinInput || "").length;
      var dots = "";
      for (var di = 0; di < 4; di++) dots += '<div class="pin-dot' + (di < pinLen ? " filled" : "") + '"></div>';
      var verifyErr = session.choresPinError ? '<div style="text-align:center;font-size:13px;font-weight:700;color:var(--wrong);">That code isn\'t right - try again.</div>' : "";
      var padKeys = "";
      for (var vn = 0; vn <= 9; vn++) {
        padKeys += '<button class="numkey" data-action="choresPinDigit" data-arg="' + vn + '">' + vn + "</button>";
      }
      if (pinLen > 0) padKeys += '<button class="numkey clear" data-action="choresPinClear">Clear</button>';
      var backAction = v.type === "chore" ? "viewChoreTimer" : "choresBackToMenu";
      return '<div class="screen">' +
        '<a href="#" class="row gap6" data-action="' + backAction + '">' + backIcon() + '<span style="font-size:14px;font-weight:700;">Back</span></a>' +
        '<div class="col center gap6" style="margin-top:4px;">' +
        '<div class="fredoka" style="font-size:19px;font-weight:700;text-align:center;">Ask a grown-up to check</div>' +
        '<div style="font-size:14px;color:var(--ink-soft);text-align:center;">' + (vdef ? vdef.label : "") + " - enter the grown-up code" + "</div>" +
        "</div>" +
        '<div class="pin-dots" style="margin-top:8px;">' + dots + "</div>" +
        verifyErr +
        '<div class="grow"></div>' +
        '<div class="numpad">' + padKeys + "</div>" +
        "</div>";
    }

    // menu (default)
    var timerActive = !!state.activeChoreTimer;
    var choreCards = CHORE_DEFS.map(function (c) {
      var isActiveTimer = timerActive && state.activeChoreTimer.key === c.key;
      var available = choreAvailable(c.key);
      var stateLabel, stateCls, clickable;
      if (isActiveTimer) { stateLabel = "In progress"; stateCls = "progress"; clickable = "viewChoreTimer"; }
      else if (!available) { stateLabel = "Done this week"; stateCls = "done"; clickable = null; }
      else if (timerActive) { stateLabel = "Finish current chore first"; stateCls = "done"; clickable = null; }
      else { stateLabel = "Start"; stateCls = "available"; clickable = "startChore"; }
      var tag = clickable ? "button" : "div";
      return '<' + tag + ' class="chore-card"' + (clickable ? ' data-action="' + clickable + '" data-arg="' + c.key + '"' : "") + '>' +
        '<span class="chore-icon">' + c.icon + "</span>" +
        '<div class="col grow" style="gap:2px;"><span class="chore-name">' + c.label + '</span><span class="chore-meta">' + c.minutes + " min &middot; +" + c.points + " pts</span></div>" +
        '<span class="chore-state ' + stateCls + '">' + stateLabel + "</span></" + tag + ">";
    }).join("");
    var achCards = ACHIEVEMENT_DEFS.map(function (a) {
      var available = achievementAvailable(a.key);
      var stateLabel = available ? "Mark done" : "Done today";
      var stateCls = available ? "available" : "done";
      var tag = available ? "button" : "div";
      return '<' + tag + ' class="chore-card"' + (available ? ' data-action="requestAchievementVerify" data-arg="' + a.key + '"' : "") + '>' +
        '<span class="chore-icon">' + a.icon + "</span>" +
        '<div class="col grow" style="gap:2px;"><span class="chore-name">' + a.label + '</span><span class="chore-meta">+' + a.points + " pts &middot; resets daily</span></div>" +
        '<span class="chore-state ' + stateCls + '">' + stateLabel + "</span></" + tag + ">";
    }).join("");

    return '<div class="screen">' +
      '<a href="#" class="row gap6" data-action="goHome">' + backIcon() + '<span style="font-size:14px;font-weight:700;">Back</span></a>' +
      '<div class="col center gap6">' +
      '<div class="fredoka" style="font-size:22px;font-weight:700;">Mega Unlocks</div>' +
      '<div style="font-size:14px;color:var(--ink-soft);text-align:center;">Big point rewards for real-life wins. A grown-up checks each one.</div>' +
      "</div>" +
      '<div class="col gap8"><div class="fredoka" style="font-size:15px;font-weight:600;">Weekly Chores</div>' +
      '<div style="font-size:12px;color:var(--ink-soft);margin-top:-6px;">One of each per week - resets Sunday at midnight.</div>' +
      '<div class="col gap8" style="margin-top:4px;">' + choreCards + "</div></div>" +
      '<div class="col gap8"><div class="fredoka" style="font-size:15px;font-weight:600;">Daily Achievements</div>' +
      '<div class="col gap8" style="margin-top:4px;">' + achCards + "</div></div>" +
      '<div class="grow"></div>' +
      "</div>";
  }
